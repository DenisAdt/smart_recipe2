name: smart_recipe_planner
description: Smart Recipe Planner — Ingredient-based recipe search using Okapi BM25
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP Client
  dio: ^5.4.3

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2

  # Charts (Evaluation dashboard)
  fl_chart: ^0.68.0

  # Icons
  cupertino_icons: ^1.0.6

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # File picker (Admin CSV upload)
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
