version: "3.9"

services:
  backend:
    build: ./backend
    container_name: srp_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////app/data/srp.db
    restart: unless-stopped

