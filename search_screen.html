<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    body {

<body class="bg-background text-on-background font-body-md min-h-screen pb-[100px] flex flex-col items-center">
<div class="w-full max-w-md w-full px-container-padding pt-xl pb-lg flex-grow">
<!-- Header -->
<header class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Apa yang ada di kulkasmu?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Pilih bahan yang kamu punya, kami akan carikan resepnya.</p>
</header>
<!-- Search Field -->
<div class="relative mb-xl">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-[#F2EEE9] text-on-surface font-body-md text-body-md pl-12 pr-md py-md rounded-[12px] border-none focus:ring-2 focus:ring-primary focus:outline-none transition-shadow placeholder:text-on-surface-variant/60" placeholder="Cari bahan (cth: Ayam, Bawang Merah, Bawang Putih)" type="text">
</div>
<!-- Selected Ingredients -->
<section class="mb-xl">
<h2 class="font-label-md text-label-md text-on-surface mb-md">Bahan Terpilih (2)</h2>
<div class="flex flex-wrap gap-sm">
<!-- Selected Chip 1 -->
<div class="inline-flex items-center gap-xs bg-primary text-on-primary px-md py-sm rounded-full font-label-sm text-label-sm shadow-[0_4px_12px_rgba(0,0,0,0.04)]">
                    Ayam
                    <button class="flex items-center justify-center hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Selected Chip 2 -->
<div class="inline-flex items-center gap-xs bg-primary text-on-primary px-md py-sm rounded-full font-label-sm text-label-sm shadow-[0_4px_12px_rgba(0,0,0,0.04)]">
                    Bawang Merah
                    <button class="flex items-center justify-center hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</section>
<!-- Popular Ingredients -->
<section class="mb-xl">
<h2 class="font-label-md text-label-md text-on-surface mb-md">Bahan Populer</h2>
<div class="flex flex-wrap gap-sm">
<!-- Popular Chip 1 -->
<button class="inline-flex items-center justify-center bg-[#F2EEE9] text-on-surface-variant px-md py-sm rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">
                    Telur
                </button>
<button class="inline-flex items-center justify-center bg-[#F2EEE9] text-on-surface-variant px-md py-sm rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">
                    Tahu
                </button>
<button class="inline-flex items-center justify-center bg-[#F2EEE9] text-on-surface-variant px-md py-sm rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">
                    Tempe
                </button>
<button class="inline-flex items-center justify-center bg-[#F2EEE9] text-on-surface-variant px-md py-sm rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">
                    Bawang Putih
                </button>
<button class="inline-flex items-center justify-center bg-[#F2EEE9] text-on-surface-variant px-md py-sm rounded-full font-label-sm text-label-sm hover:bg-surface-variant transition-colors">
                    Cabe Merah
                </button>
</div>
</section>
</div>
<!-- Fixed Bottom Button -->
<div class="fixed bottom-[90px] left-0 right-0 px-container-padding flex justify-center z-40 pointer-events-none">
<button class="pointer-events-auto w-full max-w-md bg-primary-container text-on-primary py-md rounded-[14px] font-label-md text-label-md shadow-[0_4px_12px_rgba(0,0,0,0.04)] hover:opacity-90 transition-opacity">
            Cari Resep
        </button>
</div>
<!-- BottomNavBar (Shared Component) -->
<nav class="bg-surface-container-lowest dark:bg-surface-container-lowest text-primary dark:text-primary-fixed font-label-sm text-label-sm font-headline-sm text-headline-sm fixed bottom-base left-1/2 -translate-x-1/2 w-[calc(100%-40px)] rounded-full max-w-md border border-surface-variant/20 shadow-[0_8px_20px_rgba(0,0,0,0.06)] hover:bg-surface-container-low transition-colors fixed bottom-lg left-0 right-0 z-50 flex justify-around items-center px-lg py-sm mx-container-padding">

<span class="material-symbols-outlined text-[24px] mb-xs">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary font-semibold hover:opacity-80 transition-opacity scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined text-[24px] mb-xs" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-sm text-label-sm">Search</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-on-surface-variant/60 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-[24px] mb-xs">analytics</span>
<span class="font-label-sm text-label-sm">Evaluation</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 dark:text-on-surface-variant/60 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-[24px] mb-xs">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
