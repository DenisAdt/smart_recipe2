[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --html=tests/reports/test-report.html --self-contained-html
markers =
    smoke:      Critical path — must always pass before any release
    regression: Full regression coverage
    negative:   Negative & boundary / edge-case tests
    search:     Search API (BM25 / TF-IDF)
    recipes:    Recipes CRUD & listing
    admin:      Admin CRUD & CSV upload
    evaluation: IR Evaluation metrics endpoint
    health:     Health check / system-readiness
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
